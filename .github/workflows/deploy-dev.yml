name: Deploy dev (develop vers main/dev)

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer develop
        uses: actions/checkout@v4

      - name: Recuperer main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Synchroniser dev/
        run: |
          rm -rf site/dev
          mkdir -p site/dev
          cp index.html widget.js site/dev/

      - name: Pousser main
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy dev depuis develop" || echo "aucun changement a deployer"
          git push origin HEAD:main

      # Un push GITHUB_TOKEN ne declenche pas pages-build-deplacement :
      # on demande explicitement un rebuild Pages de la branche publiee.
      - name: Demander un rebuild Pages
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
